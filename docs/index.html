<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IBM Workshop Hub</title>

    <!-- IBM Plex fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400&family=IBM+Plex+Sans:wght@300;400;600&display=swap" rel="stylesheet" />

    <!-- Carbon Design System v11 -->
    <link rel="stylesheet" href="https://unpkg.com/@carbon/styles@1/css/styles.min.css" />

    <!-- Project overrides (applied on top of Carbon) -->
    <link rel="stylesheet" href="./css/shim.css" />
    <link rel="stylesheet" href="./css/main.css" />
    <link rel="stylesheet" href="./css/components.css" />
    <link rel="stylesheet" href="./css/responsive.css" />
  </head>
  <body class="hub-view--home">
    <!-- ── Carbon UI Shell ───────────────────────────────────────── -->
    <header class="cds--header hub-header" role="banner">

      <!-- IBM 8-bar logo + product name (LEFT anchor) -->
      <a class="cds--header__name" href="#/" aria-label="IBM Workshop Hub – inicio">
        <svg class="cds--header__logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="20" height="20" aria-hidden="true" focusable="false">
          <rect x="0"  y="0"  width="32" height="4" fill="currentColor"/>
          <rect x="6"  y="7"  width="20" height="4" fill="currentColor"/>
          <rect x="8"  y="14" width="16" height="4" fill="currentColor"/>
          <rect x="6"  y="21" width="20" height="4" fill="currentColor"/>
          <rect x="0"  y="28" width="32" height="4" fill="currentColor"/>
          <rect x="0"  y="14" width="4"  height="4" fill="currentColor"/>
          <rect x="28" y="14" width="4"  height="4" fill="currentColor"/>
        </svg>
        <span class="cds--header__name--prefix">IBM</span>&nbsp;Workshop Hub
      </a>

      <!-- Primary navigation links (populated by renderPlatformNav) -->
      <nav class="cds--header__nav" aria-label="Navegación principal">
        <ul class="cds--header__menu-bar" role="menubar" id="site-nav-items"></ul>
      </nav>

      <!-- Spacer pushes global actions to the right -->
      <div class="hub-header__spacer" aria-hidden="true"></div>

      <!-- Global actions: search + theme + hamburger (mobile) -->
      <div class="cds--header__global">

        <!-- Inline search field — icon on the LEFT -->
        <div class="hub-header__search-wrap">
          <label class="visually-hidden" for="site-search">Buscar workshops</label>
          <svg class="hub-header__search-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" focusable="false">
            <path fill="currentColor" d="M15,14.3L10.7,10c1.9-2.3,1.6-5.8-0.7-7.7S4.2,0.7,2.3,3S0.7,8.8,3,10.7c2,1.7,5,1.7,7,0l4.3,4.3L15,14.3z M2,6.5C2,4,4,2,6.5,2S11,4,11,6.5S9,11,6.5,11S2,9,2,6.5z"/>
          </svg>
          <input
            id="site-search"
            class="hub-header__search-input"
            type="search"
            placeholder="Buscar…"
            autocomplete="off"
          />
        </div>

        <!-- Theme toggle -->
        <button id="theme-toggle" class="cds--header__action" type="button" aria-label="Cambiar tema" title="Cambiar tema claro/oscuro">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="20" height="20" aria-hidden="true" focusable="false">
            <path fill="currentColor" d="M16 12a4 4 0 1 1 0 8 4 4 0 0 1 0-8zm0-2a6 6 0 1 0 0 12A6 6 0 0 0 16 10zm-1-8h2v4h-2zm0 22h2v4h-2zm12-12h4v2h-4zm-22 0H0v2h4zm17.07-7.49 1.42-1.42 2.83 2.83-1.42 1.42zm-14.14 14.14-1.42-1.42 2.83-2.83 1.42 1.42zm14.14 0 2.83 2.83-1.42 1.42-2.83-2.83zm-14.14-14.14L5.1 5.1 3.69 6.51l2.83 2.83z"/>
          </svg>
        </button>

        <!-- Hamburger — mobile / tablet only (hidden on desktop via CSS) -->
        <button
          id="hamburger-btn"
          class="cds--header__action cds--header__menu-toggle"
          type="button"
          aria-label="Abrir menú de navegación"
          aria-expanded="false"
          aria-controls="side-nav"
        >
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="20" height="20" aria-hidden="true" focusable="false">
            <rect x="2" y="8"  width="28" height="2" fill="currentColor"/>
            <rect x="2" y="15" width="28" height="2" fill="currentColor"/>
            <rect x="2" y="22" width="28" height="2" fill="currentColor"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- ── Side navigation (overlay panel) ──────────────────────── -->
    <nav id="side-nav" class="cds--side-nav" aria-label="Navegación lateral" aria-hidden="true">
      <div class="hub-side-nav__header">
        <span class="hub-side-nav__title">IBM Workshop Hub</span>
      </div>
      <ul class="cds--side-nav__items" id="side-nav-items-mobile"></ul>
    </nav>
    <div id="side-nav-overlay" aria-hidden="true"></div>

    <!-- ── Lab step sub-navigation (sólo visible en vistas de lab) ── -->
    <nav class="cds--tabs hub-subnav" aria-label="Navegación del laboratorio" id="subnav-region" hidden>
      <div class="cds--tabs__nav" role="tablist" id="subnav-items"></div>
    </nav>

    <!-- ── Main content ──────────────────────────────────────────── -->
    <main class="hub-page-content">
      <section id="home-view" class="view"></section>
      <section id="lab-view" class="view" hidden>
        <div id="lab-shell" class="lab-shell"></div>
      </section>
    </main>

    <script type="module" src="./js/app.js"></script>
  </body>
</html>
